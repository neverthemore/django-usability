{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Учебный сайт с локальными ML-сервисами">
    <title>{% block title %}Локальная ML-лаборатория{% endblock %}</title>
    <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'core:home' %}" aria-label="Локальная ML-лаборатория, на главную">
                <span class="brand-mark" aria-hidden="true">ML</span>
                <span>Локальная лаборатория</span>
            </a>
            <nav aria-label="Основная навигация">
                <ul class="nav-list">
                    <li><a href="{% url 'core:home' %}" {% if active_page == 'home' %}aria-current="page"{% endif %}>Главная</a></li>
                    <li><a href="{% url 'text_classifier:index' %}"
{% if active_page == 'emotions' %}aria-current="page"{% endif %}>Эмоции</a></li>
                    <li><a href="{% url 'dialog_bot:index' %}"
{% if active_page == 'chat' %}aria-current="page"{% endif %}>Диалог</a></li>
                    <li><a href="{% url 'image_classifier:index' %}"
{% if active_page == 'images' %}aria-current="page"{% endif %}>Изображения</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>Учебный проект · Django · модели работают локально</p>
            <a href="/admin/">Панель администратора</a>
        </div>
    </footer>
</body>
</html>
